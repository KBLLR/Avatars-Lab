<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talking Portrait Gallery / Avatar Labs</title>
    <link rel="stylesheet" href="/src/styles/case-workbench.css" />
    <style>
      .portrait-review {
        box-sizing: border-box;
        max-width: 75rem;
        margin: auto;
        padding: clamp(1rem, 3vw, 2rem);
        overflow-y: auto;
      }
      .portrait-clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
      .portrait-clips figure { margin: 0; }
      .portrait-clips video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #111; }
      .portrait-clips figcaption { margin-bottom: .5rem; }
      .portrait-gallery { margin-bottom: 3rem; }
      .portrait-gallery select { font: inherit; margin: .5rem 0; }
      .portrait-gallery fieldset { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
      .portrait-gallery fieldset label { display: grid; }
      .portrait-pair { margin-block: 1rem 2rem; }
      .portrait-clips p:empty { display: none; }
    </style>
  </head>
  <body>
    <main class="portrait-review">
      <h1>Talking Portrait Gallery</h1>
      <section class="portrait-gallery" aria-labelledby="reviewTitle">
        <h2 id="reviewTitle">Review talking portraits</h2>
        <p id="reviewStatus" role="status"></p>
        <div id="reviewBody" hidden>
          <label for="reviewCast">Proposed cast</label>
          <select id="reviewCast"></select>
          <p id="reviewSentence"></p>
          <div class="portrait-clips">
            <figure>
              <figcaption>Silent driving clip</figcaption>
              <video id="reviewDriver" aria-label="Review driving clip" controls playsinline preload="metadata"></video>
              <p role="status"></p>
            </figure>
            <figure>
              <figcaption>MuseTalk FP16 render</figcaption>
              <video id="reviewRender" aria-label="Review talking render" controls playsinline preload="metadata"></video>
              <p role="status"></p>
            </figure>
          </div>
          <section id="matchedPair" class="portrait-pair" aria-labelledby="pairTitle" hidden>
            <h3 id="pairTitle">Matched comparison</h3>
            <p id="pairNotes"></p>
            <div class="portrait-clips">
              <figure>
                <figcaption>Control render</figcaption>
                <video id="pairControl" aria-label="Control render" controls playsinline preload="metadata"></video>
                <p role="status"></p>
              </figure>
              <figure>
                <figcaption>Test render</figcaption>
                <video id="pairTest" aria-label="Test render" controls playsinline preload="metadata"></video>
                <p role="status"></p>
              </figure>
            </div>
          </section>
          <p>Score from 1 to 5. For visible flaws, 5 means few or no distracting flaws. Scores stay in this browser.</p>
          <fieldset id="reviewScores">
            <legend>Review scores</legend>
          </fieldset>
        </div>
      </section>
    </main>
    <script type="module" src="/src/cases/workbench-shell.ts"></script>
    <script type="module" src="/src/talking-portrait.ts"></script>
  </body>
</html>
