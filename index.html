<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121315" />
    <title>Avatar Labs / Core-X</title>
  </head>
  <body>
    <main class="launcher-shell">
      <header class="launcher-header">
        <div class="wordmark"><span>Core-X</span> Avatar Labs</div>
        <div class="telemetry-cluster">
          <span id="renderer-state" class="telemetry">renderer: detecting</span>
          <span id="gateway-state" class="telemetry service-state" data-state="checking">gateway: checking</span>
        </div>
      </header>

      <section class="launcher-content" aria-labelledby="harness-heading">
        <div class="launcher-subheader">
          <h1 id="harness-heading">Harnesses</h1>
          <span id="case-count" class="telemetry"></span>
        </div>
        <div id="case-grid" class="case-grid"></div>
      </section>

      <footer class="launcher-footer">
        <span>Orchestrator · AVARA</span>
        <nav class="footer-links" aria-label="Avatar Labs links">
          <a href="/info.html">Info</a>
          <a href="/settings.html">Settings</a>
        </nav>
      </footer>
    </main>
    <script type="module" src="/src/launcher.ts"></script>
  </body>
</html>
